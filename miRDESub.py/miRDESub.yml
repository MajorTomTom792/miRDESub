name: miRDESub

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.12
  - fastqc
  - bowtie2
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.14.1
  - matplotlib
  - seaborn
  - biopython
  - pysam
  - cutadapt
  - anndata=0.10.8
  - zarr=2.18.2
  - numcodecs=0.15.1
  - pip
  - pip:
      - pydeseq2==0.4.12
      - formulaic-contrasts==1.0.0
